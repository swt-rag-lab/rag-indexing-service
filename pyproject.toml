[project]
name = "indexing-service"
version = "0.1.0"
description = "Indexing service for RAG Lab - transforms documents into embeddings and stores in vector DB"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "structlog==24.4.0",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.14.1",
    "asyncpg==0.30.0",
    "minio==7.2.12",
    "aio-pika==9.5.4",
    "tenacity==9.0.0",
    "openai==1.58.1",
    "qdrant-client==1.12.1",
    "tiktoken==0.8.0",
    "semchunk==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indexing_service"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["indexing_service"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["indexing_service"]

[[tool.mypy.overrides]]
module = [
    "aio_pika.*",
    "minio.*",
    "qdrant_client.*",
    "semchunk.*",
    "tiktoken.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests (no infrastructure)",
    "application: Application layer tests with fakes",
    "api: API route tests",
    "integration: Integration tests (require external services)",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]
addopts = "-ra --strict-markers"
